name: test-e2e

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions: {}

defaults:
  run:
    shell: bash

# zizmor: ignore[concurrency-limits] We don't care I guess
jobs:
  test-e2e:
    name: test-e2e
    strategy:
      matrix:
        platform:
          - ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31.10.4
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: |
          # TODO: Use artifact from "build" job
          nix-shell --pure --run 'make build'
          ./lmk -json | grep 'published_at'
